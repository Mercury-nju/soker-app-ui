name: Soker
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  Soker:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Soker
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.soker.demo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
